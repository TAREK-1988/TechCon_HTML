<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us</title>
</head>
<body>
  <!-- ===== Header ===== -->
  <header>
    <h1>Contact Us</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="schedule.html">Schedule</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <!-- ===== Main ===== -->
  <main>
    <!-- Contact details -->
    <section>
      <h2>Get in touch</h2>

      <!-- Email (must use the example exactly) -->
      <p>
        Email:
        <a href="mailto:email@example.com">email@example.com</a>
      </p>

      <!-- Social links -->
      <p>
        Follow us:
        <a href="https://twitter.com" target="_blank" rel="noopener">Twitter</a> |
        <a href="https://facebook.com" target="_blank" rel="noopener">Facebook</a> |
        <a href="https://www.linkedin.com" target="_blank" rel="noopener">LinkedIn</a>
      </p>

      <!-- Embedded Google Map -->
      <div>
        <iframe
          title="Conference Venue Map"
          style="width:100%; height:350px; border:0;"
          loading="lazy"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.84014948063!2d144.9630579153159!3d-37.81627974201198!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2z!5e0!3m2!1sen!2s!4v1700000000000">
        </iframe>
      </div>
    </section>

    <!-- Contact form -->
    <section>
      <h2>Contact Us Form</h2>
      <form>
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required>
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <!-- ===== Footer ===== -->
  <footer>
    <p>copyright © 2024 TechCon</p>
  </footer>
</body>
</html>
